services:
  eggtimer:
    build:
      args:
        APP_GID: $CURR_GID
        APP_GROUP: $APP_USER
        APP_UID: $CURR_UID
        APP_USER: $APP_USER
      context: "${PWD}"
      dockerfile: .docker/Dockerfile
    command: tail -F /dev/null # starts the container, and keeps it running
    container_name: eggtimer
    environment:
      DISPLAY: $DISPLAY # set on Linux systems
      TZ: America/Los_Angeles
    hostname: $CONTAINER_HOSTNAME # set in `repo-funcs`
    # ports:
    #   - "3001:3000"
    user: "${CURR_UID}:${CURR_GID}"
    volumes:
      # Map shell files over, so they're maintained between sessions.
      - type: bind
        # read_only: true
        source: "${PWD}/.docker/.zshrc"
        target: "/home/$APP_USER/.zshrc"
      - type: bind
        # read_only: true
        source: "${PWD}/.ignore"
        target: "/home/$APP_USER/dev" # allows for .zsh_history to be written
      # Map the current directory to the Container's WORKDIR
      - "${PWD}:/home/$APP_USER/app"
      # Map system files to Container so it can display visual output.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
